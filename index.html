<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الذكاء الاصطناعي</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 100%; max-width: 600px; height: 80vh; background: white; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #eef2f5; }
        .chat-header { background: #1a73e8; color: white; padding: 20px; text-align: center; font-size: 20px; font-weight: 600; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #fafafa; }
        .message { padding: 12px 16px; border-radius: 12px; max-width: 80%; word-wrap: break-word; line-height: 1.6; }
        .user-message { background: #1a73e8; color: white; align-self: flex-start; border-bottom-left-radius: 2px; }
        .ai-message { background: white; color: #202124; align-self: flex-end; border-bottom-right-radius: 2px; border: 1px solid #e0e0e0; }
        .error-message { background: #fce8e6; color: #c5221f; align-self: center; font-size: 14px; text-align: center; }
        .chat-input-area { display: flex; padding: 15px; background: white; border-top: 1px solid #f1f3f4; gap: 10px; }
        .chat-input-area input { flex: 1; padding: 14px; border: 1px solid #dadce0; border-radius: 24px; outline: none; }
        .chat-input-area button { background: #1a73e8; color: white; border: none; padding: 0 24px; border-radius: 24px; cursor: pointer; font-weight: bold; }
        .chat-input-area button:disabled { background: #ccc; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">مساعد الذكاء الاصطناعي 🔒</div>
    <div class="chat-messages" id="chatMessages">
        <div class="message ai-message">مرحباً بك! أنا جاهز للرد على رسائلك الآن بأمان. كيف يمكنني مساعدتك؟</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">
        <button id="sendBtn" onclick="sendMessage()">إرسال</button>
    </div>
</div>

<script>
    // الرابط المباشر الصحيح لسيرفر Vercel الخاص بك
    const API_URL = 'https://api-key-kappa.vercel.app/api/chat';

    async function sendMessage() {
        const inputElement = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const messageText = inputElement.value.trim();

        if (!messageText) return;

        appendMessage(messageText, 'user-message');
        inputElement.value = '';
        inputElement.disabled = true;
        sendBtn.disabled = true;

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: messageText })
            });

            const data = await response.json();
            if (response.ok && data.reply) {
                appendMessage(data.reply, 'ai-message');
            } else {
                appendMessage(data.error || 'حدث خطأ في جلب الرد.', 'error-message');
            }
        } catch (error) {
            appendMessage('فشل الاتصال بالسيرفر أونلاين.', 'error-message');
        } finally {
            inputElement.disabled = false;
            sendBtn.disabled = false;
            inputElement.focus();
        }
    }

    function appendMessage(text, className) {
        const chatMessages = document.getElementById('chatMessages');
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${className}`;
        messageDiv.innerText = text;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function handleKeyPress(event) { if (event.key === 'Enter') sendMessage(); }
</script>
</body>
</html>
